name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api-lint:
    name: api / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:api

  dashboard-lint:
    name: dashboard / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:dashboard

  api-typecheck:
    name: api / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:api

  dashboard-typecheck:
    name: dashboard / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:dashboard

  api-unit-tests:
    name: api / unit tests
    runs-on: ubuntu-latest
    needs:
      - api-lint
      - api-typecheck
    env:
      THROTTLE_LIMIT: ${{ vars.THROTTLE_LIMIT }}
      THROTTLE_TTL_MS: ${{ vars.THROTTLE_TTL_MS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:api

  dashboard-unit-tests:
    name: dashboard / unit tests
    runs-on: ubuntu-latest
    needs:
      - dashboard-lint
      - dashboard-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dashboard

  api-integration-tests:
    name: api / integration tests
    runs-on: ubuntu-latest
    needs:
      - api-lint
      - api-typecheck
    environment: testing
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      THROTTLE_LIMIT: ${{ vars.THROTTLE_LIMIT || '1000' }}
      THROTTLE_TTL_MS: ${{ vars.THROTTLE_TTL_MS || '60000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test:integration

  api-e2e-tests:
    name: api / e2e tests
    runs-on: ubuntu-latest
    needs:
      - api-unit-tests
      - api-integration-tests
    environment: testing
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      THROTTLE_LIMIT: ${{ vars.THROTTLE_LIMIT || '1000' }}
      THROTTLE_TTL_MS: ${{ vars.THROTTLE_TTL_MS || '60000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:api:e2e

  dashboard-e2e-tests:
    name: dashboard / e2e tests
    runs-on: ubuntu-latest
    needs:
      - dashboard-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter react-dashboard exec playwright install --with-deps
      - run: pnpm test:dashboard:e2e
