services:
  postgres-test:
    image: postgres:16-alpine
    container_name: moduflow-api-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moduflow_test
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d moduflow_test']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - moduflow-api-postgres-test:/var/lib/postgresql/data

volumes:
  moduflow-api-postgres-test:
